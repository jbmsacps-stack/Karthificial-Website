spring.application.name=backend

# Supabase PostgreSQL connection
# DB_URL must be in jdbc:postgresql://host:port/dbname?sslmode=require format
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly set dialect so Hibernate does not need to detect it from JDBC metadata
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# JWT configuration
jwt.secret=${JWT_SECRET:change-me-secret-change-this-before-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
