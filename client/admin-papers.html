<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Karthificial | Paper Manager</title>

    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="structure.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .admin-card {
            margin: 40px;
        }
    </style>
</head>

<body class="admin-checking">

    <nav class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="logo">
                <div class="logo-mark">
                    <span class="material-symbols-outlined">
                        <img src="assets/images/Favicon.png" alt="Favicon" loading="eager" fetchpriority="high">
                    </span>
                </div>
                <div class="logo-text">Karthi<span>ficial</span></div>
            </a>

            <input type="checkbox" id="menu-toggle" class="menu-toggle">

            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-menu">
                <li>
                    <a href="admin.html" class="nav-link">Dashboard</a>
                </li>

                <li>
                    <a href="mcq.html" class="nav-link">MCQ Page</a>
                </li>

                <li>
                    <a href="index.html" class="nav-link">Home</a>
                </li>

                <li class="mobile-actions auth-nav-slot"></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn-outline">Login</a>
                <a href="signup.html" class="btn-gold">Signup</a>
            </div>

        </div>
    </nav>

    <main class="container">

        <section class="admin-card">

            <h1>Question Paper Manager</h1>

            <form id="paper-form" class="paper-form" novalidate>

                <div class="form-group">
                    <label for="standard">Standard</label>

                    <select id="standard" required>
                        <option value="" disabled selected>Select Standard</option>
                        <option value="10th">10th</option>
                        <option value="12th">12th</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <select id="subject" required>
                        <option value="" disabled selected>Select Subject</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Title</label>

                    <input type="text" id="title" placeholder="Quarterly Exam 2025" required />
                </div>

                <div class="form-group">
                    <label>PDF URL</label>

                    <input type="url" id="pdf_url" placeholder="https://example.com/file.pdf" required />
                </div>

                <div class="form-group">
                    <label>Year</label>

                    <input type="text" id="year" placeholder="2025" />
                </div>

                <button type="submit" class="btn-gold">
                    Add Paper
                </button>

            </form>

            <div id="message-box"></div>

        </section>

        <section class="admin-card">

            <h2>Existing Papers</h2>

            <div id="papers-list"></div>

        </section>

    </main>

    <script src="script.js"></script>
    <script src="config.js"></script>
    <script src="clerk-auth.js"></script>
    <script src="admin.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin-papers.js?v=10"></script>

</body>

</html>
