<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TN EduPlatform - Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0A0A0A;
    color:white;
    overflow-x:hidden;
}

/* PREMIUM GOLD GLOW */
body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#D4AF3730,transparent);
    top:-150px;
    left:-100px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#F0C04020,transparent);
    bottom:-150px;
    right:-100px;
    z-index:-1;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(17,17,17,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #D4AF3730;
}

.nav-container{
    max-width:1300px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#F0C040;
    letter-spacing:1px;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    transition:0.3s;
    position:relative;
}

.nav-links a:hover{
    color:#F0C040;
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-5px;
    width:0%;
    height:2px;
    background:#F0C040;
    transition:0.3s;
}

.nav-links a:hover::after{
    width:100%;
}

.back-btn{
    padding:10px 18px;
    border:1px solid #D4AF37;
    background:transparent;
    color:#D4AF37;
    border-radius:50px;
    cursor:pointer;
    transition:0.3s;
}

.back-btn:hover{
    background:#D4AF37;
    color:black;
    transform:translateY(-2px);
}

/* PAGE */

.container{
    max-width:1300px;
    margin:auto;
    padding:40px 20px;
}

.page-title{
    text-align:center;
    font-size:42px;
    color:#F0C040;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:40px;
}

/* TABS */

.tabs{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.tab-btn{
    padding:14px 30px;
    background:#1A1A1A;
    border:1px solid #333;
    color:white;
    border-radius:50px;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

.tab-btn.active,
.tab-btn:hover{
    background:linear-gradient(135deg,#D4AF37,#F0C040);
    color:black;
    transform:translateY(-3px);
    box-shadow:0 0 20px #D4AF3740;
}

/* FILTERS */

.filters{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:30px;
}

.subject-btn{
    padding:12px 22px;
    background:#111;
    border:1px solid #444;
    color:white;
    border-radius:40px;
    cursor:pointer;
    transition:0.3s;
}

.subject-btn.active,
.subject-btn:hover{
    background:#D4AF37;
    color:black;
    transform:scale(1.05);
}

/* SEARCH + SORT */

.top-controls{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:40px;
}

.search-box{
    flex:1;
    min-width:260px;
    max-width:500px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1A1A1A;
    color:white;
    outline:none;
    border:1px solid #333;
}

.search-box input:focus{
    border-color:#D4AF37;
    box-shadow:0 0 15px #D4AF3730;
}

.sort-select select{
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1A1A1A;
    color:white;
    border:1px solid #333;
    cursor:pointer;
}

/* GRID */

.notes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.note-card{
    background:linear-gradient(145deg,#111,#1A1A1A);
    border:1px solid #D4AF3720;
    border-radius:24px;
    padding:25px;
    transition:0.4s;
    position:relative;
    overflow:hidden;
}

.note-card::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    background:#D4AF3710;
    border-radius:50%;
    top:-60px;
    right:-60px;
}

.note-card:hover{
    transform:translateY(-10px);
    border-color:#D4AF37;
    box-shadow:0 0 30px #D4AF3730;
}

.note-title{
    font-size:22px;
    margin-bottom:15px;
}

.badges{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
}

.subject-badge{
    background:#D4AF37;
    color:black;
    font-weight:bold;
}

.class-badge{
    background:#333;
}

.repeat{
    color:#ccc;
    margin-bottom:20px;
}

.download-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#D4AF37,#F0C040);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.download-btn:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px #D4AF3750;
}

/* STATUS */

.status{
    text-align:center;
    font-size:20px;
    margin-top:50px;
    color:#F0C040;
}

/* FOOTER */

footer{
    margin-top:80px;
    padding:30px;
    background:#111;
    text-align:center;
    border-top:1px solid #D4AF3720;
    color:#aaa;
}

/* MOBILE */

@media(max-width:768px){

    .page-title{
        font-size:32px;
    }

    .nav-container{
        flex-direction:column;
        gap:15px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

    .top-controls{
        flex-direction:column;
        align-items:center;
    }
}
</style>
</head>
<body>

<!-- NAVBAR -->

<nav class="navbar">
    <div class="nav-container">

        <div class="logo">TN EduPlatform</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Notes</a>
            <a href="#">Question Papers</a>
            <a href="#">Career Guidance</a>
        </div>

        <button class="back-btn">← Back</button>

    </div>
</nav>

<!-- PAGE -->

<div class="container">

    <h1 class="page-title">Premium Study Notes</h1>
    <p class="subtitle">
        High quality Tamil Nadu State Board notes for 10th & 12th students
    </p>

    <!-- TABS -->

    <div class="tabs">
        <button class="tab-btn active" data-class="10">
            10th Standard
        </button>

        <button class="tab-btn" data-class="12">
            12th Standard
        </button>
    </div>

    <!-- SUBJECTS -->

    <div class="filters">

        <button class="subject-btn active" data-subject="All">
            All
        </button>

        <button class="subject-btn" data-subject="Tamil">
            Tamil
        </button>

        <button class="subject-btn" data-subject="English">
            English
        </button>

        <button class="subject-btn" data-subject="Maths">
            Maths
        </button>

        <button class="subject-btn" data-subject="Science">
            Science
        </button>

        <button class="subject-btn" data-subject="Social Science">
            Social Science
        </button>

    </div>

    <!-- SEARCH + SORT -->

    <div class="top-controls">

        <div class="search-box">
            <input type="text" id="searchInput"
            placeholder="Search notes...">
        </div>

        <div class="sort-select">
            <select id="sortSelect">
                <option value="all">All Notes</option>
                <option value="repeated">Most Repeated</option>
            </select>
        </div>

    </div>

    <!-- STATUS -->

    <div id="status" class="status">Loading notes...</div>

    <!-- NOTES GRID -->

    <div class="notes-grid" id="notesGrid"></div>

</div>

<!-- FOOTER -->

<footer>
    © 2026 TN EduPlatform • Excellence in Education
</footer>

<script>

const notes = [
    {
        title:"Important Algebra Notes",
        subject:"Maths",
        classLevel:"10",
        repeated:15
    },
    {
        title:"Tamil Grammar Guide",
        subject:"Tamil",
        classLevel:"10",
        repeated:10
    },
    {
        title:"Physics Formula Notes",
        subject:"Science",
        classLevel:"12",
        repeated:18
    },
    {
        title:"English Writing Skills",
        subject:"English",
        classLevel:"12",
        repeated:7
    },
    {
        title:"History Important Questions",
        subject:"Social Science",
        classLevel:"10",
        repeated:13
    }
];

let currentClass = "10";
let currentSubject = "All";

const notesGrid = document.getElementById("notesGrid");
const status = document.getElementById("status");

function renderNotes(){

    status.style.display = "none";

    let filtered = notes.filter(note => {

        return note.classLevel === currentClass &&
        (currentSubject === "All" || note.subject === currentSubject);

    });

    const search = document.getElementById("searchInput")
    .value.toLowerCase();

    filtered = filtered.filter(note =>
        note.title.toLowerCase().includes(search)
    );

    if(document.getElementById("sortSelect").value === "repeated"){
        filtered.sort((a,b) => b.repeated - a.repeated);
    }

    notesGrid.innerHTML = "";

    if(filtered.length === 0){
        notesGrid.innerHTML = `
            <div class="status">
                No notes found
            </div>
        `;
        return;
    }

    filtered.forEach(note => {

        notesGrid.innerHTML += `
        <div class="note-card">

            <h3 class="note-title">${note.title}</h3>

            <div class="badges">
                <span class="badge subject-badge">
                    ${note.subject}
                </span>

                <span class="badge class-badge">
                    Class ${note.classLevel}
                </span>
            </div>

            <p class="repeat">
                Repeated ${note.repeated} times in past exams
            </p>

            <button class="download-btn">
                Download
            </button>

        </div>
        `;

    });

}

/* TABS */

document.querySelectorAll(".tab-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        document.querySelectorAll(".tab-btn")
        .forEach(b => b.classList.remove("active"));

        btn.classList.add("active");

        currentClass = btn.dataset.class;

        renderNotes();

    });

});

/* SUBJECT */

document.querySelectorAll(".subject-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        document.querySelectorAll(".subject-btn")
        .forEach(b => b.classList.remove("active"));

        btn.classList.add("active");

        currentSubject = btn.dataset.subject;

        renderNotes();

    });

});

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input", renderNotes);

/* SORT */

document.getElementById("sortSelect")
.addEventListener("change", renderNotes);

/* API EXAMPLE */

async function fetchNotes(){

    try{

        status.innerHTML = "Loading notes...";

        const url =
`/api/notes?class_level=${currentClass}&subject=${currentSubject}`;

        console.log("Fetching:", url);

        setTimeout(() => {
            renderNotes();
        }, 1000);

    }
    catch(error){

        status.innerHTML = "Error loading notes";

    }

}

fetchNotes();

</script>

</body>
</html>
