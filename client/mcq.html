<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Karthificial provides Tamil Nadu State Board notes, question papers, MCQs, and career guidance for 10th and 12th students.">

    <title>Karthificial | MCQ</title>

    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="structure.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wdth,wght,CTRS@66.9,100..900,32&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=chess" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favi.svg?v=3">
    <script type="module" src="speed-insights.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="logo">
                <div class="logo-mark"><span class="material-symbols-outlined"><img src="assets/images/Favicon.png"
                            alt="Favicon" loading="eager" fetchpriority="high"></span></div>
                <div class="logo-text">Karthi<span>ficial</span></div>
            </a>

            <input type="checkbox" id="menu-toggle" class="menu-toggle">

            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-menu">
                <li>
                    <a href="index.html" class="nav-link">Home</a>
                </li>


                <li class="dropdown">
                    <a href="notes.html" class="nav-link">Notes</a>
                </li>

                <li>
                    <a href="career-guidance.html" class="nav-link">Career Guidance</a>
                </li>

                <li>
                    <a href="mcq.html" class="nav-link">MCQ</a>
                </li>

                <li>
                    <a href="contact.html" class="nav-link">Contact</a>
                </li>

                <li class="mobile-actions auth-nav-slot"></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn-outline">Login</a>
                <a href="signup.html" class="btn-gold">Signup</a>
            </div>

        </div>
    </nav>

    <main class="resource-main">

        <main class="mcq-page">

            <!-- ========================= -->
            <!-- QUIZ SETUP -->
            <!-- ========================= -->

            <section id="mcq-setup" class="mcq-section">

                <div class="mcq-card">

                    <h1>Practice Quiz</h1>

                    <p class="mcq-subtitle">
                        Practice MCQs from any chapter.
                        Shuffle questions and options for better preparation.
                    </p>

                    <!-- SUBJECT -->

                    <div class="form-group">

                        <label for="subjectSelect">
                            Subject
                        </label>

                        <select id="subjectSelect">

                            <option>Loading...</option>

                        </select>

                    </div>

                    <!-- CHAPTERS -->

                    <div class="form-group">

                        <div class="chapter-header">

                            <label>Chapters</label>

                            <div class="chapter-actions">

                                <button id="selectAllBtn">✓ Select All</button>

                                <button id="clearBtn">✕ Clear</button>

                            </div>

                        </div>

                        <div id="chapterContainer">

                            <!-- JS generates checkboxes -->

                        </div>

                    </div>

                    <!-- QUESTION COUNT -->

                    <div class="form-group">

                        <label>

                            Number of Questions

                        </label>

                        <div class="question-count">

                            <button id="minusBtn">

                                −

                            </button>

                            <input id="questionCount" type="number" value="10" min="1">

                            <button id="plusBtn">

                                +

                            </button>

                        </div>

                        <small id="availableQuestions">

                            0 Questions Available

                        </small>

                    </div>

                    <!-- SHUFFLE -->

                    <div class="shuffle-grid">

                        <label class="shuffle-item">

                            <input type="checkbox">

                            <div>

                                <div class="shuffle-title">Shuffle Questions</div>

                                <div class="shuffle-desc">
                                    Questions will be shown in random order
                                </div>

                            </div>

                        </label>

                        <label class="shuffle-item">

                            <input type="checkbox">

                            <div>

                                <div class="shuffle-title">Shuffle Options</div>

                                <div class="shuffle-desc">
                                    Options (A, B, C, D) will be shuffled
                                </div>

                            </div>

                        </label>

                    </div>

                    <button id="startQuizBtn" class="btn-gold">

                        Start Quiz

                    </button>

                </div>

            </section>



            <!-- ========================= -->
            <!-- QUIZ SCREEN -->
            <!-- ========================= -->

            <section id="mcq-quiz" class="mcq-section hidden">

                <!-- Will be built later -->

            </section>




            <!-- ========================= -->
            <!-- RESULTS -->
            <!-- ========================= -->

            <section id="mcq-results" class="mcq-section hidden">

                <!-- Will be built later -->

            </section>

        </main>

        <script src="script.js" defer></script>
        <script src="config.js"></script>
        <script src="clerk-auth.js"></script>
        <script src="mcq.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-config.js"></script>

</body>

</html>
